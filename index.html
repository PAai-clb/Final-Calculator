<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="date-calculator-container">
        <div class="header">
            <span class="header-text">Date Calculator</span>
            <span class="info-icon">ℹ️</span>
        </div>
        <div class="content">
            <div class="input-group">
                <label>Select Date:</label>
                <div class="wheel" id="monthWheel"></div>
                <div class="wheel" id="dayWheel"></div>
                <div class="wheel" id="yearWheel"></div>
            </div>
            <div class="input-group">
                <label>Select Age:</label>
                <div class="wheel" id="ageYearWheel"></div>
                <div class="wheel" id="ageMonthWheel"></div>
                <div class="wheel" id="ageDayWheel"></div>
            </div>
            <div class="result" id="result"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
